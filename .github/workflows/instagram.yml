name: Publication Instagram

on:
  schedule:
    # Lundi et jeudi à 17h30 UTC : toujours après 18h30 Europe/Paris,
    # que l'on soit en CEST (UTC+2, ~30 min de marge) ou en CET (UTC+1, pile à l'heure).
    # Fixe à l'année, pas besoin d'ajuster au changement d'heure.
    - cron: "30 17 * * 1"
    - cron: "30 17 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
    steps:
      - name: Attendre le créneau 17h30 UTC si démarrage anticipé
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 17:30" +%s)
          NOW=$(date -u +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 900 ]; then
            echo "Démarrage anticipé — attente de ${WAIT}s jusqu'à 17h30 UTC"
            sleep "$WAIT"
          fi
          echo "Heure de lancement : $(date -u '+%H:%M:%S UTC') = $(TZ=Europe/Paris date '+%H:%M:%S %Z')"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Publier le post du jour
        run: python pipeline.py --publish

      - name: Sauvegarder l'état des posts
        run: |
          if ! git diff --quiet -- captions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add captions.json
            git commit -m "Mise à jour automatique des posts publiés"
            git push
          fi
